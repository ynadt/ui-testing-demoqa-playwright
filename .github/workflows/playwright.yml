name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Run tests automatically every day at 02:00 UTC
  schedule:
    - cron: "0 2 * * *"

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Two viewport sizes tested in parallel
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - "1920x1080"
          - "1366x768"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Chromium + Firefox) — ${{ matrix.viewport }}
        run: |
          VIEWPORT_WIDTH=$(echo ${{ matrix.viewport }} | cut -d'x' -f1)
          VIEWPORT_HEIGHT=$(echo ${{ matrix.viewport }} | cut -d'x' -f2)
          export VIEWPORT_WIDTH
          export VIEWPORT_HEIGHT
          echo "Viewport width=$VIEWPORT_WIDTH, height=$VIEWPORT_HEIGHT"
          npx playwright test --workers=4

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.viewport }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results (traces, screenshots, videos)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.viewport }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
